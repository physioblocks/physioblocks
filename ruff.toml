[lint]
select = ["E", "W", "F", "UP", "B",
"SIM", "I", "N", "RSE", "SLF", "PTH",
"NPY", "PD", "PERF", "RUF", "T20", "D"]
ignore = ["D105"]

[lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105"]
"doc/*" = ["D100", "D101", "D102", "D103", "D104", "D105"]

[lint.pydocstyle]
convention = "numpy"

[format]
docstring-code-format = true